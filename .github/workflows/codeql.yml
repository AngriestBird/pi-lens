# PR analysis runs inside ci.yml behind heavy-gate (#3801); needs: cannot cross workflows.
# This file keeps the default-branch baseline and the weekly re-scan.
on:
  push:
    branches: [master]
    paths-ignore: ["**/*.md", ".changelog/**", "docs/**"]
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - cases
              - tests/fixtures
              - dist
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
