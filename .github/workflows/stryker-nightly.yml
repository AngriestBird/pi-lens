name: Stryker nightly (test-adequacy report)

# #4005 (from the #3995 census): the Stryker mutation lane left the pull_request
# path. It found no product defect in the census window and cost 11-18% of CI
# job-minutes; what it is good for is test adequacy, which needs no per-PR
# cadence. This workflow runs scripts/stryker-diff.mjs over the runtime diff
# since the last report and keeps ONE rolling tracking issue (the title-keyed
# upsert tool-smoke.yml's idle-eviction drift step uses). It is exploratory
# and gates nothing: it is schedule and manual only, so no PR check exists.
#
# The last-report sha lives in the tracking issue's body
# (scripts/stryker-nightly.mjs). The issue permission this job already needs
# for the upsert is the only one the state needs; an artifact would add
# `actions: read` and expire, a committed file would add `contents: write`
# against a protected master.

on:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC, before tool-smoke's 06:00
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: stryker-nightly
  cancel-in-progress: false

jobs:
  report:
    name: Stryker test-adequacy report (nightly)
    runs-on: ubuntu-latest
    # The driver bounds its Stryker child at MUTATION_BUDGET_MINUTES (60), which
    # must stay strictly below this cap by at least 20 minutes: a runner kill at
    # the cap would leave the driver no chance to write its report
    # (tests/config/stryker-nightly-workflow.test.ts pins the relation).
    timeout-minutes: 90
    # Same grant as the idle-eviction drift step in tool-smoke.yml (`issues:
    # write`) plus the checkout read; nothing wider.
    permissions:
      contents: read
      issues: write
    env:
      TRACKING_TITLE: "nightly: Stryker test-adequacy report (runtime diff since the last report)"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          cache: npm
      # The window is the commits since the last report, plus the carry-over
      # queue: the files earlier nights skipped over the cap or could not finish
      # (scripts/stryker-nightly.mjs). Nothing under the runtime paths changed in
      # the window AND an empty queue means there is nothing to mutate: no run,
      # no issue edit, and the marker stays where it is.
      - name: Resolve the window since the last report
        id: window
        run: |
          set -euo pipefail
          gh issue list --state open --label nightly-drift --search "$TRACKING_TITLE in:title" --json title,body --limit 100 > "$RUNNER_TEMP/stryker-nightly-issues.json"
          WINDOW=$(node scripts/stryker-nightly.mjs base --issues "$RUNNER_TEMP/stryker-nightly-issues.json" --title "$TRACKING_TITLE" --pending-out "$RUNNER_TEMP/stryker-nightly-pending.txt")
          echo "$WINDOW" >> "$GITHUB_OUTPUT"
          BASE=$(echo "$WINDOW" | sed -n 's/^base=//p')
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$BASE" HEAD -- clients tools mcp index.ts && [ ! -s "$RUNNER_TEMP/stryker-nightly-pending.txt" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no runtime change since $BASE and nothing queued; nothing to report"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.window.outputs.run == 'true'
        run: npm ci --ignore-scripts
      - if: steps.window.outputs.run == 'true'
        run: npm run build
      - name: Mutate the queued files and the window's runtime diff
        id: stryker
        if: steps.window.outputs.run == 'true'
        continue-on-error: true
        env:
          BASE: ${{ steps.window.outputs.base }}
          HEAD_SHA: ${{ steps.window.outputs.head }}
        run: |
          set -euo pipefail
          ARGS=(--base "$BASE" --max-files 12 --runtime-only --head-sha "$HEAD_SHA")
          # Each queued line is `path@sha`: the driver reads that file against
          # its own base (scripts/stryker-nightly.mjs, the base rule).
          if [ -s "$RUNNER_TEMP/stryker-nightly-pending.txt" ]; then
            ARGS+=(--pending-file "$RUNNER_TEMP/stryker-nightly-pending.txt")
          fi
          node scripts/stryker-diff.mjs "${ARGS[@]}"
      - name: Render job summary
        if: always() && steps.window.outputs.run == 'true' && hashFiles('reports/mutation/mutation.json') != ''
        run: node scripts/mutation-report.mjs --out "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.window.outputs.run == 'true'
        with:
          name: mutation-report
          path: reports/mutation/mutation.json
          if-no-files-found: ignore
      # Scoped like tool-smoke's tracking-issue writers: a branch dispatch must
      # not touch issues. One persistent issue, refreshed in place and never
      # closed by the job (the kill criterion is a maintainer decision).
      - name: Update the tracking issue
        if: always() && steps.window.outputs.run == 'true' && (github.event_name == 'schedule' || github.ref == 'refs/heads/master')
        env:
          BASE: ${{ steps.window.outputs.base }}
          HEAD_SHA: ${{ steps.window.outputs.head }}
          SOURCE: ${{ steps.window.outputs.source }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STRYKER_OUTCOME: ${{ steps.stryker.outcome }}
        run: |
          set -euo pipefail
          STATUS=failed
          if [ "$STRYKER_OUTCOME" = success ]; then STATUS=ok; fi
          node scripts/stryker-nightly.mjs body --issues "$RUNNER_TEMP/stryker-nightly-issues.json" --title "$TRACKING_TITLE" --base "$BASE" --head "$HEAD_SHA" --source "$SOURCE" --status "$STATUS" --report reports/mutation/mutation.json --run-url "$RUN_URL" --out "$RUNNER_TEMP/stryker-nightly-body.md"
          gh label create nightly-drift --color B60205 --description 'Nightly automated drift finding' || true
          node scripts/upsert-tracking-issue.mjs --title "$TRACKING_TITLE" --label nightly-drift --body-file "$RUNNER_TEMP/stryker-nightly-body.md"
      # A driver failure must not read as a green night: the issue body says
      # FAILED and this row is red.
      - name: Fail the run when the driver failed
        if: steps.stryker.outcome == 'failure'
        run: |
          echo "::error::scripts/stryker-diff.mjs failed; see the step log and the tracking issue"
          exit 1
