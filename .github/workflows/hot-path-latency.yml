name: Hot-path latency

# #4363: times session_start, dispatch and the diagnostics-cache replay on the
# checked-out commit and on its first parent, and fails only on a regression
# that is both statistically significant and above a stated threshold. A pull
# request checks out GitHub's merge of its head into master's tip, so the first
# parent is that tip and the comparison isolates what the PR changes. A master
# push compares the pushed commit with the one before it. The rule, the
# sampler and the fixtures are in scripts/lib/latency-stats.mjs,
# scripts/check-hot-path-latency.mjs and scripts/hot-path-sample.mjs. Before
# this lane only a reviewer re-running a probe caught #4344 round 1 (replay
# 6 ms to 321 ms).
#
# ADVISORY. The check name ends in "(advisory)", so ci-verdict and the check
# list read a red as a note, and the job does not use continue-on-error, so the
# run conclusion stays truthful. Flip it to a required check only after 10
# consecutive master push runs conclude success with no false red:
#
#   gh run list --workflow hot-path-latency.yml --branch master --event push \
#     --limit 10 --json conclusion --jq 'all(.[]; .conclusion == "success")'
#
# Prints true when the last 10 master runs were all green. A red master run is
# read by hand: a real regression resets the count only if it was not fixed by
# a later commit; a false red resets it and is a threshold bug.
#
# COST. About 6 minutes of one ubuntu-latest runner: install, two cold tsc
# builds, 2 x 16 one-process samples of about 2.5 s. It runs only when a path
# the hot paths read changes (the filters below). It uses no Actions cache
# (setup-node `cache:` is off on purpose): the repository sits at its 10 GB
# cache cap (#4358) and a cache write here would evict a CI entry.
#
# LIMIT. Both trees run on the head's node_modules, so a dependency bump is not
# compared. The sampler times pi-lens's own code; a language server's time is
# not in it.

on:
  pull_request:
    branches: [master]
    paths:
      - "clients/**"
      - "tools/**"
      - "rules/**"
      - "index.ts"
      - "vendor/**"
      - "tsconfig*.json"
      - "scripts/hot-path-sample.mjs"
      - "scripts/check-hot-path-latency.mjs"
      - "scripts/lib/latency-stats.mjs"
      - ".github/workflows/hot-path-latency.yml"
  push:
    branches: [master]
    paths:
      - "clients/**"
      - "tools/**"
      - "rules/**"
      - "index.ts"
      - "vendor/**"
      - "tsconfig*.json"
      - "scripts/hot-path-sample.mjs"
      - "scripts/check-hot-path-latency.mjs"
      - "scripts/lib/latency-stats.mjs"
      - ".github/workflows/hot-path-latency.yml"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: hot-path-latency-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  latency:
    name: Hot-path latency (advisory)
    runs-on: ubuntu-latest
    # Measured on the first run of this lane: see the PR that added it. The
    # script stops itself at 10 minutes (DEFAULT_BUDGET_MS), half of this cap.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Build head
        run: npm run build

      # HEAD^1 is master's tip for a pull request (the merge ref's first parent)
      # and the previous commit for a push or a manual run.
      - name: Build base
        run: |
          set -eu
          base_sha=$(git rev-parse HEAD^1)
          echo "base $base_sha, head $(git rev-parse HEAD)"
          git worktree add --detach "$RUNNER_TEMP/base" "$base_sha"
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/base/node_modules"
          cd "$RUNNER_TEMP/base"
          npm run build

      - name: Time the hot paths on base and head
        run: |
          node scripts/check-hot-path-latency.mjs \
            --base "$RUNNER_TEMP/base" --head "$PWD" --runs 15 \
            --scratch "$RUNNER_TEMP/hot-path-scratch" \
            --json "$RUNNER_TEMP/hot-path-latency.json"
