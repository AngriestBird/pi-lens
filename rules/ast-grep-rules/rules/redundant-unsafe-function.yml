id: redundant-unsafe-function
language: Rust
severity: error
message: Unsafe function without unsafe block inside
note: |
  A function marked `unsafe` advertises that the body contains operations the
  compiler cannot verify as safe. If the body has no `unsafe` block, either
  the marker is unnecessary (the function performs no unsafe operations and
  the `unsafe` keyword should be removed) or it is misplaced (an unsafe
  operation lives outside an `unsafe { … }` block and should be wrapped).
  Either case warrants review.

  Exempt when a `/// # Safety` doc-comment section precedes the function:
  Rust's own convention (rustdoc's `missing_safety_doc` lint, and
  clippy's `undocumented_unsafe_blocks`) is that an `unsafe fn` states
  its caller obligations in a `# Safety` doc section instead of wrapping
  its whole body in a redundant `unsafe { ... }` block — the function
  signature IS the unsafe boundary, the doc section is where the
  contract lives. Mirrors the `SAFETY:`-comment valve already shipped
  for `no-chained-type-assertions` (same relational shape: `follows` a
  preceding comment matching the marker, `stopBy: end` to scan back
  through the doc-comment lines). A function with no `# Safety` section
  — documented or not — still gets no escape valve.
rule:
  all:
    - kind: function_item
    - has:
        kind: function_modifiers
        regex: "^unsafe"
    - not:
        has:
          kind: unsafe_block
          stopBy: end
    - not:
        follows:
          stopBy: end
          kind: line_comment
          regex: '#\s*Safety'
