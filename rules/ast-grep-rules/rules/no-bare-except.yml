id: no-bare-except
language: Python
message: "Avoid bare 'except' — catch specific exceptions instead"
severity: error
note: |
  Bare 'except' clauses catch all exceptions including KeyboardInterrupt
  and SystemExit. Always specify the exception types you want to handle.
  The original rule used `not: has: kind: identifier, stopBy: end`.
  `stopBy: end` walks ALL descendants of the except_clause — including
  identifiers inside the body (function calls like `foo()`). The rule
  then incorrectly excluded ANY except clause whose body had any
  identifier, making it fire only for empty bodies or `pass`/`raise`
  (where there are no function-call identifiers).

  The fixed rule checks the except_clause's direct children for ANY of
  the five exception-spec shapes: bare identifier `except E`, dotted
  attribute `except asyncio.TimeoutError`, tuple `except (E, F)`,
  parenthesized single name `except (E)`, or `as` pattern `except E as e`.
  The original missed the attribute, tuple, `as_pattern`, and
  `parenthesized_expression` forms — a dotted name or a tuple like
  `(ValueError, KeyError)` has no direct `identifier` child (the
  identifiers are inside the attribute/tuple), and `except Exception as e`
  has no direct `identifier` child either (`e` lives inside the
  `as_pattern`, which the suppression list covers) — dotted/qualified
  names are the #1031 sibling of the #1026 tree-sitter fix;
  `parenthesized_expression` mirrors that filter's spec set).
rule:
  kind: except_clause
  not:
    any:
      - has:
          kind: identifier
      - has:
          kind: attribute
      - has:
          kind: tuple
      - has:
          kind: parenthesized_expression
      - has:
          kind: as_pattern
