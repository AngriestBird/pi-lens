# Kotlin Prefer data class
# Detects a plain class whose primary constructor is made entirely of
# val/var properties and that carries no additional function body, a strong
# signal it's a value holder that should be a data class.
# Ported from vinhnx/VTCode rules/kotlin/prefer-data-class.yml (#2198, refs #2195).
id: kotlin-prefer-data-class
language: kotlin
severity: warning
message: "This class looks like a plain value holder; consider a data class"
note: |
  A data class generates equals/hashCode/toString/copy/componentN for free,
  which a hand-written value holder either lacks or must maintain by hand.
  Detection-only: adding `data` changes equality semantics (structural
  instead of referential), generates a public API surface (copy, componentN)
  the class may not want to expose, and is invalid on classes that inherit
  from another class, none of which this rule can verify — it excludes
  classes carrying any modifier (open/abstract/sealed/inner/data/enum/…) and
  classes with a function in their body, but a caller may still have other
  reasons the plain class is intentional.
rule:
  all:
    - kind: class_declaration
    - not:
        has:
          kind: modifiers
    - has:
        kind: primary_constructor
        has:
          kind: class_parameter
        not:
          has:
            kind: class_parameter
            not:
              has:
                kind: binding_pattern_kind
    - not:
        has:
          kind: class_body
          has:
            kind: function_declaration
files:
  - "**/*.kt"
tags:
  - kotlin
  - idiom
  - readability
examples:
  bad: |
    class Point(val x: Int, val y: Int)
  good: |
    data class Point(val x: Int, val y: Int)
