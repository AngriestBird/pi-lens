    // /^(typescript|python|marksman|opengrep):/ is prose, not code.
    const one = "typescript|python";
  - |
    const one = /^(typescript):/;
  - |
    const one = ["typescript"];
invalid:
  - |
    const servers = /^(typescript|python|marksman|opengrep):/;
