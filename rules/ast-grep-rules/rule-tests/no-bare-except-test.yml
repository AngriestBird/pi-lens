id: no-bare-except
valid:
  - |
    try:
        doThing()
    except ValueError:
        handle()
  - |
    try:
        doThing()
    except (ValueError, KeyError):
        handle()
  - |
    try:
        doThing()
    except Exception as e:
        handle(e)
  - |
    # dotted/qualified name (#1031)
    try:
        doThing()
    except asyncio.TimeoutError:
        handle()
  - |
    # parenthesized single name (mirrors #1026's tree-sitter spec set)
    try:
        doThing()
    except (ValueError):
        handle()
invalid:
  - |
    try:
        doThing()
    except:
        handle()
  - |
    try:
        doThing()
    except:
        pass
