\* expect: violated DerivedIsCurrent
\* module: LspCrash
\* Mutant: the dead-client respawn (ensureClientForServer's dead-client branch) forgets retireClient's derived drop, so the replacement reads its predecessor's EWMA, aux backlog or timeout streak.
CONSTANTS
    Shape = "SS"
    Concurrent = FALSE
    Silent = TRUE
    MaxCrashes = 1
    Uptimes = {"early","mid","long"}
    MaxEvicts = 0
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = TRUE
    ColdGuard = TRUE
    RegClear = TRUE
    ReadyGuard = TRUE
    Fix = "bind"
    DerivedMissPath = "respawn"
SPECIFICATION Spec
INVARIANTS TypeOK DerivedIsCurrent
CHECK_DEADLOCK FALSE
