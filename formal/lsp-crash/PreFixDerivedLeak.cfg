\* expect: violated DerivedIsCurrent
\* module: LspCrash
\* Pre-#3672 code: only the notify-stall path dropped the aux backlog count; capacity eviction, idle eviction and the dead-client respawn missed it, and no path dropped the drain-latency EWMA. A replacement reads its predecessor's state.
CONSTANTS
    Shape = "SS"
    Concurrent = FALSE
    Silent = TRUE
    MaxCrashes = 1
    Uptimes = {"early","mid","long"}
    MaxEvicts = 1
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = TRUE
    ColdGuard = TRUE
    RegClear = TRUE
    ReadyGuard = TRUE
    Fix = "bind"
    DerivedMissPath = "legacy"
SPECIFICATION Spec
INVARIANTS TypeOK DerivedIsCurrent
CHECK_DEADLOCK FALSE
