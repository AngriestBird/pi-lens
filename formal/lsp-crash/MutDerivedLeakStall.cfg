\* expect: violated DerivedIsCurrent
\* module: LspCrash
\* Mutant: notify-stall demotion (demoteForNotifyStall) forgets retireClient's derived drop, so the client that spawns after the demotion reads its predecessor's timeout streak, EWMA or aux backlog.
CONSTANTS
    Shape = "SS"
    Concurrent = FALSE
    Silent = TRUE
    MaxCrashes = 0
    Uptimes = {"early","mid","long"}
    MaxEvicts = 1
    LeaseCheck = TRUE
    PingGuard = TRUE
    WaitTimeout = TRUE
    FastPath = TRUE
    WindowTrip = TRUE
    Trip = 3
    ClearReadyOnDeath = TRUE
    ColdGuard = TRUE
    RegClear = TRUE
    ReadyGuard = TRUE
    Fix = "bind"
    DerivedMissPath = "stall"
SPECIFICATION Spec
INVARIANTS TypeOK DerivedIsCurrent
CHECK_DEADLOCK FALSE
