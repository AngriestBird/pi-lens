\* expect: violated NoSharedEphemeralDir
\* module: LspEphemeralDataDir
\* Pre-#4127 pid-only naming: pid reuse makes two live processes share a dir.
CONSTANTS
    ProcIds = {a, b}
    Pids = {1}
    Roots = {r}
    MaxStarts = 3
    UniqueToken = FALSE
    SafeSweep = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoSharedEphemeralDir
CHECK_DEADLOCK FALSE
