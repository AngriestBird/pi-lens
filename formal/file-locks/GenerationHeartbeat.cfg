\* expect: pass
\* module: GenerationLock
\* The install lock since #3515: the holder heartbeats its generation
\* (`startGenerationHeartbeat`) and re-checks ownership before its critical
\* write (`ownsTopGeneration`). The lease can be shorter than the hold because
\* the heartbeat renews it, so with no stalled interval a live holder is never
\* taken over and MutualExclusion holds through a crash.
CONSTANTS
    Procs = {p1, p2, p3}
    MaxCrashes = 1
    AllowExpiry = TRUE
    MaxGen = 5
    Cleanup = TRUE
    Recheck = TRUE
    Rounds = 2
    ListedMarker = FALSE
    Heartbeat = TRUE
    HeartbeatStall = FALSE
    OwnsTop = TRUE
SPECIFICATION Spec
SYMMETRY Symmetry
INVARIANTS MutualExclusion NoLiveTakeover NoLostRegistration NoOrphanLock
CHECK_DEADLOCK FALSE
