\* expect: violated NoLiveTakeover
\* module: GenerationLock
\* A heartbeat that misses one interval (`HeartbeatStall`): the lease lapses
\* under a live holder and a contender takes over. The ownership re-check
\* keeps the superseded holder out of its critical write, so MutualExclusion
\* holds, but a live holder was taken over. This is the #3553 residual: the
\* check and the spawn it guards are separate production steps, and the model
\* collapses them, so a taker landing between them would still overlap.
CONSTANTS
    Procs = {p1, p2, p3}
    MaxCrashes = 0
    AllowExpiry = TRUE
    MaxGen = 5
    Cleanup = TRUE
    Recheck = TRUE
    Rounds = 2
    ListedMarker = FALSE
    Heartbeat = TRUE
    HeartbeatStall = TRUE
    OwnsTop = TRUE
SPECIFICATION Spec
SYMMETRY Symmetry
INVARIANTS NoLiveTakeover MutualExclusion NoLostRegistration NoOrphanLock
CHECK_DEADLOCK FALSE
