\* expect: violated MutualExclusion
\* module: GenerationLock
\* The same stalled interval without the ownership re-check: the superseded
\* holder still enters its critical write, so two live holders overlap. This
\* isolates the second defense of #3515 from the heartbeat. NoLiveTakeover is
\* left off this config's list so TLC reports the overlap it is about.
CONSTANTS
    Procs = {p1, p2, p3}
    MaxCrashes = 0
    AllowExpiry = TRUE
    MaxGen = 5
    Cleanup = TRUE
    Recheck = TRUE
    Rounds = 2
    ListedMarker = FALSE
    Heartbeat = TRUE
    HeartbeatStall = TRUE
    OwnsTop = FALSE
SPECIFICATION Spec
SYMMETRY Symmetry
INVARIANTS MutualExclusion NoLostRegistration NoOrphanLock
CHECK_DEADLOCK FALSE
