\* expect: violated NoLostCarry
\* module: SessionLifecycle
\* D3 check: the G10 slot is filled at session_before_fork, so a read that lands before session_shutdown is missing from the fork.
CONSTANTS
    Transitions = {"Fork"}
    Writers = {"read"}
    FixParts = {"entryCapture","consumeOnMatch","processOrderTurn","dedupe","recordDrop"}
    MaxSteps = 1
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- TargetSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoStaleBranchWrite NoLostCarry NoUnrecordedFalseBlock NoOwnDrop SecondaryIsolation HandoffOnce OrderMonotone OneResetPerScope NoForeignFact
CHECK_DEADLOCK FALSE
