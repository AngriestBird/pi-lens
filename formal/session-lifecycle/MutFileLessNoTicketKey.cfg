\* expect: violated NoCrossSessionAdoption
\* module: SessionLifecycle
\* #3819's fix without "ticketKey": H3FileLess with only "clearOnStart" (option a). The subagent's own /reload or /fork is the first primary start after the stash, so it matches (reason, undefined) and takes the primary's slot before any clear.
CONSTANTS
    Transitions = {"New","Reload","Fork","SecStart","SecReload","SecFork"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","clearOnStart"}
    FileLess = {"A","N","F","C","S","T"}
    MaxSteps = 4
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionAdoption
CHECK_DEADLOCK FALSE
