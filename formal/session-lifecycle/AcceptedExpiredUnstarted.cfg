\* expect: violated NoLostActivation
\* module: SessionLifecycle
\* Residual of #3668 and #4113 (F1 of #3803): a /fork whose start is interrupted by its own /reload before pi-lens's handler ran (W0) forwards the slot only while the marker names the gap (namedSuccessorReason); once the marker expired the shutdown forwards nothing, so the inner reload's start misses the slot. Mut4113Unstarted is the same loss without the TTL.
CONSTANTS
    Transitions = {"Fork","InterruptUnstarted","MarkerExpire"}
    Writers = {"activate"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy","namedSuccessor","nameAtShutdown","forwardUnstarted","markerTtl"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoLostActivation
CHECK_DEADLOCK FALSE
