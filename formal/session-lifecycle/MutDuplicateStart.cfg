\* expect: violated OneResetPerScope
\* module: SessionLifecycle
\* #2890 guard mutant: without the duplicate-start gate, a second session_start re-runs the reset.
CONSTANTS
    Transitions = {"Dup"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","recordDrop"}
    MaxSteps = 1
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- TargetSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoStaleBranchWrite NoLostCarry NoUnrecordedFalseBlock NoOwnDrop SecondaryIsolation HandoffOnce OrderMonotone OneResetPerScope
CHECK_DEADLOCK FALSE
