\* expect: violated NoStaleBranchWrite
\* module: SessionLifecycle
\* #3521 tree half, master: no session_tree handler, so /tree keeps reads of entries the branch no longer holds.
CONSTANTS
    Transitions = {"Tree"}
    Writers = {"read"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop"}
    MaxSteps = 1
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TodayPolicy
    Fence <- TargetFence
    SecPolicy <- TargetSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoStaleBranchWrite NoLostCarry NoUnrecordedFalseBlock NoOwnDrop SecondaryIsolation HandoffOnce OrderMonotone OneResetPerScope NoForeignFact
CHECK_DEADLOCK FALSE
