\* expect: pass
\* module: SessionLifecycle
\* Fixed in #3855 r4 (verify r3 V3, probe PR12): an in-memory /new whose start a /reload interrupts runs on a manager no stash bound; the forward binds the interrupted scope's ticket ("bindInterrupted"), so the reload gap is named by it, and a gap subagent's own in-memory /reload or an SDK reload bind (no key) stays secondary. Mut3855r3InterruptedNewGap keeps the pre-fix violation.
CONSTANTS
    Transitions = {"New","Interrupt","SecStart","SecReload","SecBindReplace"}
    Writers = {"activate"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy","namedSuccessor","bindInterrupted"}
    FileLess = {"N","S"}
    MaxSteps = 4
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK PrimaryIsUsers HasPrimary NoLostActivation
CHECK_DEADLOCK FALSE
