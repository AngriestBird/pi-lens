\* expect: violated SecondaryIsolation
\* module: SessionLifecycle
\* #3607: the subagent shares the primary's read guard, and the primary's /tree filters the subagent's reads away.
CONSTANTS
    Transitions = {"SecStart","Tree"}
    Writers = {"secRead"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop"}
    MaxSteps = 2
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- TodaySec
SPECIFICATION Spec
INVARIANTS TypeOK SecondaryIsolation NoStaleBranchWrite NoUnrecordedFalseBlock
CHECK_DEADLOCK FALSE
