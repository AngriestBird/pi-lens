\* expect: pass
\* module: SessionLifecycle
\* #3819 fix, the StaleSlotFileBacked trace with file-less sessions: the demoted session inherits the primary's session manager on /reload, so the ticket key alone still matches; "clearOnStart" removes the slot first. Six steps.
CONSTANTS
    Transitions = {"New","Reload","Fork","SecStart","SecReload","SecFork"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","clearOnStart"}
    FileLess = {"A","N","F","C","S","T"}
    MaxSteps = 6
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK HandoffOnce NoCrossSessionAdoption
CHECK_DEADLOCK FALSE
