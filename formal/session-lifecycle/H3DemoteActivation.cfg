\* expect: violated NoLostActivation
\* module: SessionLifecycle
\* #3668 row 17, file-backed: the subagent's own /reload in the primary's /reload gap classifies primary, and its own activations are lost: as a secondary it never stashed or saved a sidecar, so the new primary adopts nothing. The demoted real successor's loss is invisible here, since NoLostActivation checks primaries only; H3DemoteCarry and H3DemoteAdvisory show it.
CONSTANTS
    Transitions = {"Reload","SecStart","SecReload","SecFork"}
    Writers = {"activate"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoLostActivation
CHECK_DEADLOCK FALSE
