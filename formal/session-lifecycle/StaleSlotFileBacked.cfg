\* expect: pass
\* module: SessionLifecycle
\* #3819 fix, TLC's 5-step HandoffOnce trace from the #3835 review, file-backed: the primary's /reload leaves its slot, the gap subagent's own /fork classifies primary (#3668 row 17) and demotes the real successor, the subagent runs /new, and in that gap the demoted session reloads and classifies primary. Every primary start clears the slot ("clearOnStart"), so that reload takes nothing. Six steps.
CONSTANTS
    Transitions = {"New","Reload","Fork","SecStart","SecReload","SecFork"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","clearOnStart"}
    FileLess = {}
    MaxSteps = 6
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK HandoffOnce NoCrossSessionAdoption
CHECK_DEADLOCK FALSE
