\* expect: violated HandoffOnce
\* module: SessionLifecycle
\* Known bug #3819 (review S1 on #3835), file-backed: the primary's /reload leaves its slot; a subagent's own /fork in the gap classifies primary (#3668 row 17) and the real successor is demoted; that primary's /new keeps the slot; the demoted session's own /reload classifies primary and takes scope 1's stale slot. Same conversation, so NoCrossSessionAdoption holds; the take is by a start that did not replace the slot's writer.
CONSTANTS
    Transitions = {"New","Reload","Fork","SecStart","SecReload","SecFork"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope"}
    FileLess = {}
    MaxSteps = 5
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK HandoffOnce
CHECK_DEADLOCK FALSE
