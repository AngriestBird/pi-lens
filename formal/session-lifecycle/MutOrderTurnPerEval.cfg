\* expect: violated OrderMonotone
\* module: SessionLifecycle
\* N3 (#3540 case A): the order turn is a field of each entry-module evaluation; a /reload that re-evaluates the entry restarts it while the widget's guard keeps its tokens.
CONSTANTS
    Transitions = {"Reload"}
    Writers = {"widget"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","dedupe","recordDrop"}
    MaxSteps = 1
    MaxTurns = 3
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- TargetSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoStaleBranchWrite NoLostCarry NoUnrecordedFalseBlock NoOwnDrop SecondaryIsolation HandoffOnce OrderMonotone OneResetPerScope NoForeignFact
CHECK_DEADLOCK FALSE
