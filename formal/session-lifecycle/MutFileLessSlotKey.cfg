    FileLess = {"A","N","F","C","S","T"}
    MaxSteps = 4
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionAdoption
CHECK_DEADLOCK FALSE
