\* expect: violated NoCrossSessionAdoption
\* module: SessionLifecycle
\* #3819, H3FileLess without "ticketKey" (the merged S2 key): file-less sessions key the slot on (reason, undefined), so a subagent's own /reload or /fork classified primary in the primary's replacement gap (#3668 row 17) takes the primary's slot. Clearing the slot at every primary start ("clearOnStart", option a) does not help: that start is the first one after the stash.
CONSTANTS
    Transitions = {"New","Reload","Fork","SecStart","SecReload","SecFork"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","clearOnStart"}
    FileLess = {"A","N","F","C","S","T"}
    MaxSteps = 4
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionAdoption
CHECK_DEADLOCK FALSE
