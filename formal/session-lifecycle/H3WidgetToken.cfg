\* expect: pass
\* module: SessionLifecycleF1
\* Merged widget write token (F1 of #3803): two pipeline runs, each a diagnostics verb and a runner verb that land in either order at any later step, across /new, /reload, /fork, and quit with pi --fork (a new process restarts the order turn). The guard drops an older token and admits a tie (>=), so the widget shows the newest write of each verb; a /reload or /fork start carries the rows (WidgetStore policy), and a retired scope's late verb is fenced out.
CONSTANTS
    Transitions = {"New","Reload","Fork","Quit","PiFork","WidgetPipe"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","widgetFence"}
    FileLess = {}
    MaxSteps = 2
    MaxTurns = 3
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION SpecF1
INVARIANTS TypeOKF1 ShowsNewest NoOwnDropWidget NoLostWidget WidgetInLineage
CHECK_DEADLOCK FALSE
