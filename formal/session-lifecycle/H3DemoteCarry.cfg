\* expect: pass
\* module: SessionLifecycle
\* Fixed bug #3855 (#3668 row 17), file-backed: a subagent's own /reload or /fork in the primary's /reload gap is not the successor the shutdown named ("namedSuccessor","bindInterrupted"), so it stays secondary and the real successor is primary and adopts the slot with the conversation's reads. Pre3855DemoteCarry keeps the pre-fix violation.
CONSTANTS
    Transitions = {"Reload","SecStart","SecReload","SecFork"}
    Writers = {"read"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","ticketKey","demotedDiscard","forwardUnadopted","forwardPolicy","namedSuccessor","bindInterrupted"}
    FileLess = {}
    MaxSteps = 3
    MaxTurns = 0
    LateHandlers = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK HasPrimary NoLostCarry
CHECK_DEADLOCK FALSE
