\* expect: violated NoRestoreOverNewer
\* module: SiblingRestore
\* SiblingRestoreQueued without `SettleCapture`: the run leaves `active` when the tool exits, so an agent edit whose tool_call comes after that (window A of #3830) is neither in flight nor captured, and the queued restore still writes the older capture over it.
\* It keeps the pre-#3830 report-history values (KeepCaptureHistory, CarryPreRunCalls and RestoreNoCapInFlight = FALSE) on purpose: under the code's values, with CarryPreRunCalls = TRUE, the run's calls in flight at its start are carried into the restore's check, window A is closed, and TLC finds no violation (8920 states generated, 4483 distinct), so the model does not show SettleCapture as load-bearing for NoRestoreOverNewer under the as-built values.
CONSTANTS
    SEdits = 2
    SReplacer = 0
    SReplaced = 0
    SConcurrent = TRUE
    SInOrderNotes = FALSE
    SAtomic = FALSE
    SRestore = TRUE
    SettleCapture = FALSE
    RestoreRecheck = TRUE
    RestoreQueue = TRUE
    SCallInRun = TRUE
    KeepCaptureHistory = FALSE
    CarryPreRunCalls = FALSE
    RestoreNoCapInFlight = FALSE
    RestoreInFlight = TRUE
    TargetHold = TRUE
    RestoreGatesHold = FALSE
    LspMulti = TRUE
SPECIFICATION Spec
INVARIANTS NoRestoreOverNewer NoNoopRestore
CHECK_DEADLOCK TRUE
