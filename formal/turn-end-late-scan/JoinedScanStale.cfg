\* expect: violated NoStaleCover
\* module: LateScan
\* Registered: after a session replacement the new session has no entry, so its
\* analyze() JOINS the old session's running vulture (single flight) and covers
\* its own edits with a result that predates them.
CONSTANTS
    Edits = {1, 2, 3}
    MaxSess = 2
    MaxScan = 3
    MaxEnt = 3
    Settle = "checked"
    SettlePoison = "guarded"
    Poison = "start"
    Late = "keep"
    InFlight = "carry"
    CarryRec = "on"
    EntryScope = "session"
    Foreign = "off"
    TakeBackoff = "on"
    Backoff = "both"
    StampAt = "settle"
SPECIFICATION Spec
INVARIANTS TypeOK NoStaleCover
CHECK_DEADLOCK FALSE
