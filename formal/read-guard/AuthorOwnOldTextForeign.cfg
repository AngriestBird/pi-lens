\* expect: pass
\* module: ReadGuard
\* #4387 keeps #4210's fail-closed direction: after the own oldText edit advanced the
\* authorship, another writer changes a line, and the positional edit after it is refused
\* (content identity). NoFalseBlock is not checked: bash, edit, edit is BashAuthoredPre4387's
\* trace under the same no-injection state.
CONSTANTS
    N0 = 3
    MaxLen = 4
    AgentOps = 3
    Ops = {"bash","oedit","edit"}
    Spans = {1}
    ExtWrites = 1
    ExtKinds = {"replace"}
    ExtPhases = {"idle"}
    FixKind = "none"
    FormatDrain = "none"
    Bounds = {}
    MaxBounds = 0
    Hashes = TRUE
    Ctx = 0
    HandlerEvidence = FALSE
    CreationHandlerEvidence = FALSE
    MtimeAuthored = FALSE
    OwnEditRescue = FALSE
    ForkImport = FALSE
    SuppressByNewerContext = TRUE
    FormatStamp = FALSE
    ProvisionalCredit = FALSE
    RevokeFailedRead = TRUE
    BlockRelease = "end"
    RecordAuthoritative = TRUE
    RecordOwnEdit = TRUE
    OwnEditSkipsReloc = TRUE
    SpanSnapshot = TRUE
    RelocFromLatest = TRUE
    WholeVouchesPastEnd = FALSE
    ForkAtBoundary = FALSE
    BranchFilter = TRUE
    DrainMode = "atomic"
    FileTimeCheck = TRUE
    CoverageCheck = TRUE
    SnapshotCheck = TRUE
    AuthorIdentity = TRUE
    RetireAtWrite = TRUE
    AuthorBranch = TRUE
    BridgeNoAdvance = TRUE
    ZeroReadInjects <- ZeroReadInjectsPre4387
SPECIFICATION Spec
INVARIANTS NoStaleAllow NoBlindAllow
CHECK_DEADLOCK FALSE
