\* expect: violated NoStaleAllow
\* module: ReadGuard
\* #4187 R5-1 mutation: the per-(call,path) license is reusable, so the
\* second record under the settled id re-baselines over the external writer.
\* The four operations are the minimum trace: bash establishes the initial
\* authorship required by own, own is the checked call/write, ownagain is the
\* second settled record, and edit is the witness. The state constraint below
\* removes unrelated reorderings while retaining every state in that trace
\* (the external rewrite does not consume AgentOps); it matches the passing
\* SpendLicense = TRUE config exactly.
CONSTANTS
    N0 = 3
    MaxLen = 4
    AgentOps = 4
    Ops = {"bash", "own", "ownagain", "edit"}
    Spans = {1}
    ExtWrites = 1
    ExtKinds = {"replace"}
    ExtPhases = {"idle"}
    FixKind = "none"
    FormatDrain = "none"
    Bounds = {}
    MaxBounds = 0
    Hashes = TRUE
    Ctx = 0
    HandlerEvidence = FALSE
    CreationHandlerEvidence = FALSE
    MtimeAuthored = FALSE
    OwnEditRescue = FALSE
    ForkImport = FALSE
    SuppressByNewerContext = TRUE
    FormatStamp = FALSE
    RecordAuthoritative = TRUE
    RecordOwnEdit = TRUE
    OwnEditSkipsReloc = TRUE
    SpanSnapshot = TRUE
    RelocFromLatest = TRUE
    WholeVouchesPastEnd = FALSE
    ForkAtBoundary = FALSE
    BranchFilter = TRUE
    DrainMode = "atomic"
    FileTimeCheck = TRUE
    CoverageCheck = TRUE
    SnapshotCheck = TRUE
    ProvisionalCredit = FALSE
    RevokeFailedRead = TRUE
    BlockRelease = "end"
    AuthorIdentity = TRUE
    RetireAtWrite = TRUE
    AuthorBranch = TRUE
    BridgeNoAdvance = FALSE
SPECIFICATION Spec
INVARIANTS NoStaleAllow NoBlindAllow
CONSTRAINT
    (ops = 0 /\ ext = 0 /\ pc = "idle" /\ ~written.on)
    \/ (ops = 1 /\ ext = 0 /\ pc = "idle" /\ written.on /\ ~written.lic)
    \/ (ops = 2 /\ ext = 0 /\ pc = "ownpending" /\ written.on /\ written.lic)
    \/ (ops = 2 /\ ext = 0 /\ pc = "idle" /\ written.on /\ ~written.lic /\ written.c = disk)
    \/ (ops = 2 /\ ext = 1 /\ pc = "idle" /\ written.on /\ ~written.lic /\ written.c # disk)
    \/ (ops = 3 /\ ext = 1 /\ pc = "idle" /\ written.on /\ ~written.lic /\
        ((written.ret /\ written.c # disk) \/ (~written.ret /\ written.c = disk)))
    \/ ops = 4
CHECK_DEADLOCK FALSE
