\* expect: pass
\* module: DependencyAnswer
\* The fix (#4782): a stored answer settles nothing while a later receipt is pending, so after an ordered drain from a server that republishes the dependent as it reads the dependency, the dispatch reads the answer computed against the dependency's new bytes.
CONSTANTS
    PendingGuard = TRUE
    Republish = TRUE
    MaxPubs = 3
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS NewestAtSettle NoPhantomFinding
CHECK_DEADLOCK FALSE
