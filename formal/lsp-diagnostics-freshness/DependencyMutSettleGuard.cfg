\* expect: violated NewestAtSettle
\* module: DependencyAnswer
\* The guard on the early return alone: the quiet window settles on a stored answer while a later receipt is pending. After a drained phase both answers postdate the dependency here, so this breaks the rule, not NoPhantomFinding; the unit file shows the stale read for a wait that starts first.
CONSTANTS
    PendingGuard = TRUE
    Republish = TRUE
    MaxPubs = 3
    Mutant = "noSettleGuard"
SPECIFICATION Spec
INVARIANTS NewestAtSettle
CHECK_DEADLOCK FALSE
