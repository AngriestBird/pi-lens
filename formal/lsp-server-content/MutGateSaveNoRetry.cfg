\* expect: violated SaveFollowsSavedTouch
\* module: ServerContent
\* #4532 gap 9 round 5, F3 mutant: the code before this round. The skip takes
\* the save mark before sending and the failure leaves nothing behind, so the
\* mark names bytes no didSave ever covered, every later saved touch of them
\* owes nothing, and the server keeps content it was never told is saved. The
\* round-4 change makes it reachable: a standalone save no longer blocks the
\* skip, so the byte-identical touch that used to re-push (and carry its own
\* save) now stays silent.
