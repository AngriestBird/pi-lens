\* expect: violated NoAppliedAfterWrite
\* module: LspRenameEdit
\* Non-vacuity for Merged: a rename applies after a write to a touched file.
CONSTANTS
    Files = {t, o, u}
    Target = t
    Opened = {o}
    Flow = "rename"
    Rule = "merged"
    PiWriteFiles = {t, o}
    ExternalFiles = {t, o}
    TouchFiles = {t, o}
    KeepMtime = TRUE
    WatcherPrompt = FALSE
    AbortAfterText = FALSE
    Margin = 1
    MaxWrites = 2
    MaxClock = 4
SPECIFICATION Spec
INVARIANTS NoAppliedAfterWrite
CHECK_DEADLOCK FALSE
