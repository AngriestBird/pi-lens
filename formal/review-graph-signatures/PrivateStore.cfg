\* expect: pass
\* module: ReviewGraphSignatures
\* #3552 (merged, PR #3746): the graph extracts on a run-local FactStore. A same-file dispatch can land between the content read and the derived read, but its write goes to the shared store the graph does not read, so every node stays single-version.
CONSTANTS
    Procs = {p1}
    Writers = {p1}
    Observers = {p1}
    Files = {f1}
    MaxWrites = 3
    AllowFastpath = TRUE
    FixFpNoop = TRUE
    FixFpExtract = TRUE
    SharedStore = FALSE
SPECIFICATION Spec
INVARIANTS NodeSingleVersion MemHonest DiskHonest NoStaleServedAsCurrent
CHECK_DEADLOCK FALSE
