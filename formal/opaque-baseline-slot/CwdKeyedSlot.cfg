\* expect: violated EveryWriteAttributed
\* module: OpaqueBaselineSlot
\* Pre-fix store: one key per cwd:generation. Every tool_call precedes the
\* first tool_result, so a later Record overwrites the earlier baseline and
\* its call finds nothing at Take (the S8 trace: RECORD x3, TAKE found,
\* none, none).
CONSTANTS
    Writers = {1, 2, 3}
    Keying = "cwd"
    Cap = 3
    Subtract = TRUE
    Observe = "counted"
    Sequential = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK EveryWriteAttributed SlotLossObservable
CHECK_DEADLOCK FALSE
