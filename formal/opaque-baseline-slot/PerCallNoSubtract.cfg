\* expect: violated EveryWriteAttributed
\* module: OpaqueBaselineSlot
\* Per-call keying alone is not enough: the first call to take claims its
\* siblings' paths as opaque, the pipeline skips their authored dispatch as
\* already analysed, and the siblings lose authorship (the keying-only run of the
\* parallel-bash test: 1 of 3 authored).
CONSTANTS
    Writers = {1, 2, 3}
    Keying = "call"
    Cap = 3
    Subtract = FALSE
    Observe = "counted"
    Sequential = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK EveryWriteAttributed SlotLossObservable
CHECK_DEADLOCK FALSE
