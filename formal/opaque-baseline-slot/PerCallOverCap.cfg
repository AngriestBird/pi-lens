\* expect: pass
\* module: OpaqueBaselineSlot
\* More parallel calls than the store's cap: the oldest baseline is dropped
\* and counted, so the loss is observable (attribution is guaranteed only up
\* to the cap).
CONSTANTS
    Writers = {1, 2, 3}
    Keying = "call"
    Cap = 2
    Subtract = TRUE
    Observe = "counted"
    Sequential = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK SlotLossObservable
CHECK_DEADLOCK FALSE
