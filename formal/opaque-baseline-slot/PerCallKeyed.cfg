\* expect: pass
\* module: OpaqueBaselineSlot
\* The fix: one key per tool-call id and overlapping siblings' recognized
\* paths subtracted. Three parallel calls all keep authorship; nothing is
\* displaced.
CONSTANTS
    Writers = {1, 2, 3}
    Keying = "call"
    Cap = 3
    Subtract = TRUE
    Observe = "counted"
    Sequential = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK EveryWriteAttributed SlotLossObservable
CHECK_DEADLOCK FALSE
