\* expect: pass
\* module: OpaqueBaselineSlot
\* Today's rows: bash calls that never overlap share the one cwd slot
\* without loss, with the pre-fix keying. The fix must not move this case.
CONSTANTS
    Writers = {1, 2, 3}
    Keying = "cwd"
    Cap = 3
    Subtract = TRUE
    Observe = "counted"
    Sequential = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK EveryWriteAttributed SlotLossObservable
CHECK_DEADLOCK FALSE
