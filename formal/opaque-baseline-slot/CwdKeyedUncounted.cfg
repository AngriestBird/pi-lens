\* expect: violated SlotLossObservable
\* module: OpaqueBaselineSlot
\* Pre-fix observability: the overwrite was counted only in
\* OpaqueBaselineStore.evictionCount, which no production code read, so a
\* lost baseline left no record.
CONSTANTS
    Writers = {1, 2, 3}
    Keying = "cwd"
    Cap = 3
    Subtract = TRUE
    Observe = "none"
    Sequential = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK SlotLossObservable
CHECK_DEADLOCK FALSE
