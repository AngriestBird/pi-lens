\* expect: pass
\* module: CascadeDelivery
\* Merged (#4485, #4486, #4487): tier-3 neighbours answer in-lane or are named
\* pending, snapshots and fallbacks serve only post-edit observations, no
\* recently-clean skip, no rolling delta, turn_end peeks the registry and an
\* expiring touch is read, and a delivered error stays pending until observed
\* clean.
CONSTANTS
    Neighbours = {"n1", "n2"}
    Models = {"Pull", "CmdPull", "Always", "Silent"}
    MaxTurns = 3
    Expiry = 1
    QuietFires = TRUE
    TierPath = "inLane"
    PassiveGate = "afterEdit"
    FallbackGate = "afterEdit"
    RecentlyClean = FALSE
    Delta = "none"
    UnconfirmedMarker = "marked"
    ExpiryRead = "peekLog"
    Reserve = "record"
SPECIFICATION Spec
INVARIANTS TypeOK NoCleanWithoutFreshObs NoErrWithoutFreshObs PersistentReserved TouchEndsWithinBound AnswerWhenAskable ExpiryKeepsAnswer
CHECK_DEADLOCK FALSE
