\* expect: pass
\* module: SessionRegistry
\* #3849 on the merged behavior (#3657 and #3703): two secondaries share one
\* non-primary root. The holder-count fix keeps that root through the first
\* removal.
CONSTANTS
    Contention = FALSE
    HbRepair = TRUE
    ClearIntent = TRUE
    RootRemoval = "queued"
    Teardown = "off"
    PeerStuck = FALSE
    Reaper = FALSE
    SharedSec = TRUE
    FixParts = {"generation","child","rootIntent","retry","holderCount"}
SPECIFICATION Spec
INVARIANTS TypeOK NoGhostRoot LiveRepairable RootRemovedOnce SharedRootHeld RootCountMatches
CHECK_DEADLOCK FALSE
