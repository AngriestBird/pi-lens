\* expect: pass
\* module: SessionRegistry
\* The merged behaviour (#3657 and #3703): a declined secondary's root is in
\* the entry and its removal takes one lease-waiting lock on the tail; the
\* test worker's exit joins the tail with a bound. The other process may hold
\* the lock forever.
CONSTANTS
    Contention = TRUE
    HbRepair = TRUE
    ClearIntent = TRUE
    RootRemoval = "queued"
    Teardown = "bounded"
    PeerStuck = TRUE
    Reaper = FALSE
    FixParts = {"generation","child","rootIntent","retry"}
SPECIFICATION Spec
INVARIANTS TypeOK NoGhostRoot LiveRepairable NoExitWhileHeld RootRemovedOnce TeardownProgress
CHECK_DEADLOCK FALSE
